    <text x="214" y="47">two lobes = coupled sides</text>
    <text x="214" y="72">narrow waist = interface</text>
    <text x="214" y="97">knotted beads = local excitation</text>
    <text x="214" y="122">rotation = repeated drive</text>
    <text x="214" y="147">sound/vibration = propagating response</text>
